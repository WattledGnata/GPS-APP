# 调查结论（review 独立 grep 核实）：sector 过线**确有记录**（非数据源缺失）——TFIC 预置赛道定义 2 个
#   TimingGateType.Sector 门、LapTimingEngine.handleSectorCrossing 检测并记 CrossingEvent(gateType=Sector)、
#   TestSessionViewModel 无差别持久化全部 crossing 到 Room（带 crossingWallClockTimestampMs）、getLapTelemetry
#   已用 queryBySessionId 把全部 crossing 读进内存——只是 L317 写死 listOf(lapStartWallClock) 没用 sector。
# 改法：getLapTelemetry 从已读内存 crossings filter accepted Sector + 非空 wallClock + 落半开窗口
#   [lapStart,lapEnd) + 去重 ==lapStart + 升序，前置 lapStart 组多段；空集回退单段（不回归 baseline）。
#   复用内存零额外 DB 查询，core/domain 0 改动，不改 schema/engine/公共协议。时钟域统一 wallClock。
# #16 drift（本 round 核心，review verdict=PASS）：sectorBoundaries 单段→多段是**良性扩展**——
#   SectorBar(SectorBar.kt computeSectorBounds)本为多段设计、LapAlignment grep 0 命中不读该字段、
#   W2 MockTelemetry 早已造 3 元素 → 本 round 实质消除"生产 reader 恒单段 vs W2 mock 多段"的契约漂移，
#   首次在生产激活 SectorBar 多段路径。无任何已合回 round 假设 size==1。
# 测试：LapTelemetryReadersTest 补 case M-R（多段/回退单段/窗口外排除反例/rejected+null排除/==lapStart去重/
#   跨时钟域 guard 反例），17 test 全绿；mutation 验证 case O 删窗口过滤即 fail（真断言非假绿）。
# FileLogger：见 review_findings_l1 P2（模块边界，诊断=返回值 self-describing，埋点 deferred 到 detail 屏 round）。
# 真机 SKIP（纯数据层无 UI）；逻辑由单测兜底；可观测性缺口已透明声明。
