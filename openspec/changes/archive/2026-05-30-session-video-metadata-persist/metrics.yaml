# --- road-test-first 落地 ---
# 目标：Phase 2 视频管线把每个 lap session 录的视频路径 + 视频起始 wallClock 锚点持久化（供视频帧↔遥测对齐 + 删 session 连带删视频）。本 round 只加字段/通道/删除白名单，不实现录制（录制是 round3）。
# 3-class 勘察：2-class（无 DTO）——Entity(TelemetrySessionEntity) + Domain(TelemetryModels.TelemetrySession) + mapper(TelemetryRepository.toDomain 内联扩展)；videoFilePath/videoStartedAtWallClock 三处全同步加（均 nullable，不用哨兵——#6 防旧 session 误命中）。
# 迁移：AppDatabase v5→v6，migration5To6（ALTER ADD COLUMN videoFilePath TEXT + videoStartedAtWallClock INTEGER，nullable），migrationChain size 升至 4（v2→v6 连续）。列定义与 Room 对 String?→TEXT / Long?→INTEGER NULL 一致（沿用 v3→v4 同款 nullable ADD 模式，已有测试证明 Room 接受）。
# 持久化通道：TelemetryRepository.attachVideoToSession(sessionId, videoFilePath, videoStartedAtWallClock) + TelemetrySessionDao.updateVideoMetadata；不改 startSession/endSession 语义（视频 opt-in 与 session 解耦）。
# 删除白名单：deleteSession 删 binary 用 /telemetry/、删视频用 /telemetry/ 或 /video/ canonicalPath 校验防 path traversal；videoFilePath!=null 才连带删。
# 日志：core/data 不依赖 feature/test（FileLogger 在 feature/test）→ 删视频用 android.util.Log（成功/不存在/失败/白名单拒绝 4 埋点，adb logcat 可查）；如需落文件由 round3 在 feature/test 层包装 attachVideoToSession 调用点加 FileLogger。
# #14 fake DAO：updateVideoMetadata 加到 DAO 接口后补全 8 个 FakeTelemetrySessionDao/FakeSessionDao stub。
# #16 跨 round 共享字段：videoFilePath/videoStartedAtWallClock 消费方 = camera-recording-and-gps-sync(round3 待实现) —— round3 录制首帧回调写 videoStartedAtWallClock、Finalize 写 videoFilePath via attachVideoToSession；round3 apply 时 MUST verify 字段正确传播（tasks §10 已登记）。
# 测试：migration5To6 SQL 断言 + chain size=4 + deleteSession 视频白名单（/video/ 内删 / 白名单外拒绝）+ mapper 往返（null/非null）；:core:data testDebugUnitTest 169 / 0 fail，:core:data + :core:domain + :feature:test compile 全绿。
# follow-up：room-test-infrastructure（MigrationTestHelper 端到端 schema 验证，沿用 restore round 登记）。
