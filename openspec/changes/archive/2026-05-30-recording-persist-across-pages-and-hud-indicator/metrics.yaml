# --- road-test-first 落地（含 2 轮路测 bug 修复）---
# 初版(3ec82dd)：camera 绑定生命周期重构 + 跨页状态 UI（HUD REC 红点+时长+可点停）。
# 路测 bug A（预览黑屏）：attachPreviewSurface 跑在 bind 前 preview=null no-op，bind 后无人补连 surface。
#   修复：engine 存 pendingPreviewView，bind 后补连 surface。
# 路测 bug B（录制 code=4）：LaunchedEffect key=isRecording，录制开始 false→true 重跑 rebind 打断 VideoCapture 管道。
#   修复：key 改 shouldBind(=settledPage==1||isRecording)，录制中不翻转不重跑；bind/unbind 加幂等守卫(isBound+lifecycleOwner 引用比较)。
# 注释 rot 修正(7c2c899)：CameraPreviewPage L483/L535 错描述 onDispose unbindAll stop 录制，实际只 detachPreviewSurface。
